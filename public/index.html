<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小言宝 · VoicePal — 头颈癌工作台（原型 v0.1）</title>
<style>
:root{
  --ink:#16211d; --ink-2:#3c4a44; --muted:#6f7d76;
  --paper:#f6f4ee; --paper-2:#fffdf8; --line:#ddd8cc; --line-2:#ebe6da;
  --teal:#0f6b5c; --teal-soft:#e3efea; --teal-deep:#08463c;
  --terra:#b4653f; --terra-soft:#f6e7de;
  --crit:#9c2f1c; --crit-soft:#f7e2dd;
  --warn:#8a6a1f; --warn-soft:#f7eed6;
  --radius:10px; --radius-lg:16px;
  --shadow:0 1px 2px rgba(22,33,29,.05),0 8px 24px -12px rgba(22,33,29,.18);
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:"Songti SC","Noto Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); color:var(--ink); background:var(--paper);
  font-size:14.5px; line-height:1.72; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}

/* ---------- 顶栏：三段式（左 品牌+版本 / 中 一句状态 / 右 操作） ---------- */
.topbar{
  display:flex;align-items:center;gap:16px;
  padding:10px 20px;background:var(--paper-2);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:baseline;gap:8px;flex:0 0 auto}
.brand b{font-family:var(--serif);font-size:19px;letter-spacing:.02em;font-weight:600}
.brand .en{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.vchip{
  font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:99px;
  background:var(--teal-soft);color:var(--teal-deep);border:1px solid #cfe2db;
}
.topbar .status{
  flex:1 1 auto;min-width:0;text-align:center;font-size:12.5px;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
@media (max-width:560px){
  .topbar{gap:10px;padding:10px 12px}
  .brand .en{display:none}
  .topbar .actions{gap:5px}
  .topbar .actions .mini{padding:2px 7px;font-size:11px}
}
.topbar .actions{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}

/* ---------- 布局 ---------- */
.shell{display:grid;grid-template-columns:196px minmax(0,1fr) 0;min-height:calc(100vh - 53px);transition:grid-template-columns .22s ease}
.shell.with-agent{grid-template-columns:196px minmax(0,1fr) 340px}

/* ---------- 左侧一级导航 ---------- */
.sidenav{border-right:1px solid var(--line);background:var(--paper-2);padding:14px 10px 40px}
.profile-switch{margin:0 4px 14px;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.profile-switch label{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px}
.profile-switch select{width:100%;border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.sidenav .grp{font-size:10.5px;letter-spacing:.12em;color:var(--muted);margin:14px 10px 6px;text-transform:uppercase}
.sidenav a{
  display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;
  color:var(--ink-2);text-decoration:none;font-size:13.5px;cursor:pointer;
}
.sidenav a:hover{background:var(--line-2)}
.sidenav a[aria-current="page"]{background:var(--teal);color:#fff;font-weight:500}
.sidenav a .dot{width:6px;height:6px;border-radius:99px;background:currentColor;opacity:.35;flex:0 0 auto}
.sidenav a[aria-current="page"] .dot{opacity:1;background:#fff}
.sidenav a .track{margin-left:auto;font-family:var(--mono);font-size:10px;opacity:.55}

/* ---------- 主区 ---------- */
.main{min-width:0;padding:22px 28px 80px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:6px}
.crumb b{color:var(--ink);font-weight:600}
h1{font-family:var(--serif);font-size:26px;line-height:1.3;margin:0 0 4px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:0 0 18px}

/* 二级页签 */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding-bottom:2px;border-bottom:1px solid var(--line)}
.tabs button{
  border:0;background:transparent;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;
  font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button:hover{background:var(--line-2)}
.tabs button[aria-selected="true"]{color:var(--teal-deep);border-bottom-color:var(--teal);font-weight:600;background:var(--teal-soft)}

/* 卡片 */
.card{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius-lg);padding:18px 20px;margin:0 0 16px;box-shadow:var(--shadow)}
.card > h3{font-family:var(--serif);font-size:16.5px;margin:0 0 10px;font-weight:600}
.card > h3 + .hint{margin-top:-6px}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* 键值表 */
dl.kv{display:grid;grid-template-columns:9.5em 1fr;gap:6px 14px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted);font-size:12.5px}
dl.kv dd{margin:0;color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--ink-2);border-bottom:1px solid var(--line);padding:7px 8px;font-size:12.5px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line-2);padding:7px 8px;vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* 标签 */
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.teal{background:var(--teal-soft);color:var(--teal-deep)}
.tag.terra{background:var(--terra-soft);color:var(--terra)}
.tag.crit{background:var(--crit-soft);color:var(--crit)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.src{font-size:11.5px;color:var(--muted)}

/* 提示块 */
.notice{border-left:3px solid var(--teal);background:var(--teal-soft);padding:10px 14px;border-radius:0 var(--radius) var(--radius) 0;font-size:13px;margin:12px 0}
.notice.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.notice.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.notice b{font-weight:600}
blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--line);background:#fbfaf5;font-size:13px;color:var(--ink-2)}
blockquote cite{display:block;font-size:11.5px;color:var(--muted);font-style:normal;margin-top:4px}

/* 折叠：原生 details */
details.fold{border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin:10px 0;overflow:hidden}
details.fold > summary{cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:500;list-style:none;display:flex;align-items:center;gap:8px}
details.fold > summary::-webkit-details-marker{display:none}
details.fold > summary::before{content:"▸";color:var(--muted);transition:transform .15s;display:inline-block}
details.fold[open] > summary::before{transform:rotate(90deg)}
details.fold[open] > summary{border-bottom:1px solid var(--line-2)}
details.fold .body{padding:12px 14px}

/* 指标卡：固定高度 + 3D 翻转 */
.metric-card{
  height:276px;perspective:900px;cursor:pointer;outline:none;border-radius:var(--radius-lg);
}
.metric-card:focus-visible{box-shadow:0 0 0 3px var(--teal-soft),0 0 0 4px var(--teal)}
.mc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1)}
.metric-card[data-flipped="true"] .mc-inner{transform:rotateY(180deg)}
.mc-face{
  position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);
  border-radius:var(--radius-lg);background:var(--paper-2);padding:14px 16px;overflow:hidden;
  display:flex;flex-direction:column;
}
.mc-face.back{transform:rotateY(180deg);background:#fff}
.mc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mc-name{font-size:13px;color:var(--ink-2);font-weight:600}
.mc-val{font-family:var(--mono);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:6px;letter-spacing:-.02em}
.mc-val .u{font-size:13px;color:var(--muted);margin-left:4px;letter-spacing:0}
.mc-delta{font-size:12.5px;color:var(--ink-2);margin-top:2px;font-family:var(--mono)}
.mc-meta{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.5}
.mc-back-h{font-size:12px;color:var(--muted);margin:0 0 6px}
.mc-back-body{font-size:12px;color:var(--ink-2);overflow:auto}
.mc-back-body table{width:100%;font-size:11.5px;border-collapse:collapse}
.mc-back-body td{padding:2px 4px;border-bottom:1px dotted var(--line)}
.mc-flip-hint{position:absolute;right:12px;bottom:10px;font-size:10.5px;color:var(--muted);opacity:.75}

/* 一图秀 */
.chart-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--line);border-radius:var(--radius);background:#fff;padding:6px}
.chart-wrap svg{display:block;min-width:560px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 0;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:var(--radius);background:#fdfcf7}

/* 关切清单 */
.concern{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid var(--line-2)}
.concern:last-child{border-bottom:0}
.concern .txt{font-size:13.5px}
.concern .meta{font-size:11.5px;color:var(--muted);margin-top:3px}
.concern .ops{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 8px;font-size:11.5px;cursor:pointer}
.mini:hover{background:var(--line-2)}
.mini[aria-pressed="true"]{background:var(--teal);color:#fff;border-color:var(--teal)}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;background:#fff}
.addrow select,.addrow button{border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:#fff;font-size:13px;cursor:pointer}
.addrow button{background:var(--teal);color:#fff;border-color:var(--teal)}

/* 右栏 Agent 面板 */
.agent{border-left:1px solid var(--line);background:var(--paper-2);display:none;flex-direction:column;min-width:0}
.shell.with-agent .agent{display:flex}
.agent header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.agent header b{font-size:13.5px}
.agent .msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.agent .m{font-size:13px;padding:9px 12px;border-radius:10px;max-width:92%}
.agent .m.ai{background:var(--teal-soft);color:var(--teal-deep);align-self:flex-start}
.agent .m.me{background:#fff;border:1px solid var(--line);align-self:flex-end}
.agent .composer{border-top:1px solid var(--line);padding:10px;display:flex;gap:6px}
.agent .composer input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:13px}
.agent .composer button{border:0;background:var(--teal);color:#fff;border-radius:8px;padding:0 12px;cursor:pointer}
.agent .tools{padding:8px 10px;border-top:1px solid var(--line-2);display:flex;gap:6px;flex-wrap:wrap}

/* 急救卡（打印） */
.rescue{border:2px solid var(--crit);border-radius:var(--radius);padding:16px 18px;background:#fff}
.rescue h4{margin:0 0 8px;font-family:var(--serif);font-size:16px;color:var(--crit)}
.rescue .big{font-size:13.5px;line-height:1.8}

/* 响应式 */
@media (max-width:1180px){
  .shell,.shell.with-agent{grid-template-columns:170px minmax(0,1fr)}
  .shell.with-agent .agent{position:fixed;right:0;top:53px;bottom:0;width:min(340px,86vw);z-index:50;box-shadow:-12px 0 32px -18px rgba(0,0,0,.3)}
}
@media (max-width:820px){
  .shell,.shell.with-agent{grid-template-columns:1fr}
  .sidenav{position:fixed;left:0;top:53px;bottom:0;width:min(240px,80vw);z-index:60;transform:translateX(-102%);transition:transform .2s;overflow:auto}
  .sidenav.open{transform:none;box-shadow:12px 0 32px -18px rgba(0,0,0,.3)}
  .main{padding:16px 16px 70px}
  .topbar .status{display:none}
  h1{font-size:22px}
}
@media print{
  .topbar,.sidenav,.tabs,.agent,.no-print{display:none!important}
  .shell,.shell.with-agent{grid-template-columns:1fr}
  .main{padding:0}
  .card{box-shadow:none;border:0;padding:0;margin:0 0 10px}
  body{background:#fff;font-size:12pt}
  .rescue{border-width:3px}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <b>小言宝</b><span class="en">VoicePal</span>
    <span class="vchip">v0.1.1 · 原型</span>
  </div>
  <div class="status" id="topStatus">演示数据 · 未接入真实病历</div>
  <div class="actions">
    <button class="mini" id="btnMenu" style="display:none">目录</button>
    <button class="mini" id="btnAgent" aria-pressed="false">AI 助手</button>
    <button class="mini" id="btnPrint">打印本页</button>
  </div>
</div>

<div class="shell" id="shell">
  <nav class="sidenav" id="sidenav">
    <div class="profile-switch">
      <label for="prof">演示档案</label>
      <select id="prof">
        <option value="A">A · 喉癌 · 全喉切除后</option>
        <option value="B">B · 鼻咽癌 · 放疗为主</option>
      </select>
    </div>
    <div id="navList"></div>
  </nav>

  <main class="main" id="main">
    <div class="crumb" id="crumb"></div>
    <h1 id="pageTitle"></h1>
    <p class="sub" id="pageSub"></p>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div id="wbPage"></div>
  </main>

  <aside class="agent" id="agent">
    <header>
      <b>AI 助手</b>
      <span class="tag teal">演示</span>
      <button class="mini" id="btnAgentClose" style="margin-left:auto">收起</button>
    </header>
    <div class="msgs" id="agentMsgs">
      <div class="m ai">我看到了你正在看的页面。可以让我帮你把这段整理成一句话、或生成一份带去复诊的摘要。</div>
      <div class="m me">帮我把「堵管了怎么办」这段说给我老伴听，她不太懂。</div>
      <div class="m ai">好。我会把页面上的三步改成口语，并提醒她：<b>这不是伤口，是唯一的呼吸通道</b>。点下面的按钮可以把这段复制走。</div>
    </div>
    <div class="tools">
      <button class="mini" id="btnCopyPrompt">复制场景提示词</button>
      <button class="mini" id="btnCopySummary">复制本页要点</button>
    </div>
    <div class="composer">
      <input id="agentInput" placeholder="问点什么…（演示环境不会真的发送）">
      <button id="agentSend">发送</button>
    </div>
  </aside>
</div>

<script>

<script>

const STATE = { profile:'A', page:'board', tab:'今天要知道的', win:'all', flipped:{} };

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUBJ = () => DEMO[STATE.profile];
const src  = t => `<div class="src">来源：${esc(t)}</div>`;

const tag = (t, c) => `<span class="tag${c?' '+c:''}">${esc(t)}</span>`;
const empty = t => `<div class="empty">${t}</div>`;

const fold = (sum, inner, open) => `<details class="fold"${open?' open':''}><summary>${sum}</summary><div class="fold-body">${inner}</div></details>`;
const tbl = (head, rows, cls) => {
  if(rows.length===1 && Array.isArray(rows[0]) && Array.isArray(rows[0][0])) rows = rows[0];
  return `<table class="tbl${cls?' '+cls:''}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
};
const NONE = '<span class="src">未记录</span>';
const YES = v => v==null ? NONE : esc(v);
const md = d => d ? d.slice(0,10) : '—';

function toast(msg){
  let t = $('#toast');
  if(!t){ t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); }
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 1900);
}

function visibleTabs(pageId){
  const s = SUBJ();
  let tabs = NAV.find(n=>n.id===pageId).tabs.slice();
  if(s.site === '鼻咽'){
    tabs = tabs.filter(t => t !== '手术与切除范围');
    if(pageId === 'tx'){
      tabs = ['放疗'].concat(tabs.filter(t => t !== '放疗'));
    }
  }
  return tabs;
}

function renderNav(){
  $('#navList').innerHTML = NAV.map(n=>{
    const on = n.id === STATE.page;
    const isNpcCollapsed = SUBJ().site==='鼻咽' && (n.id==='airway' || n.id==='voice');
    return `<a href="#/${n.id}" data-page="${n.id}" aria-current="${on?'page':'false'}"><span class="dot"></span>${esc(n.name)}${isNpcCollapsed?'<span class="src" style="display:block;font-size:10.5px;margin-left:14px">本部位默认折叠</span>':''}</a>`;
  }).join('');
  $$('#navList a').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault();
    STATE.page = a.dataset.page;
    STATE.tab = visibleTabs(STATE.page)[0];
    render();
  }));
}

function renderTabs(){
  const tabs = visibleTabs(STATE.page);
  if(!tabs.includes(STATE.tab)) STATE.tab = tabs[0];
  $('#tabs').innerHTML = tabs.map(t=>`<button role="tab" data-tab="${esc(t)}" aria-selected="${t===STATE.tab}">${esc(t)}</button>`).join('');
  $$('#tabs button').forEach(b=>b.addEventListener('click',()=>{ STATE.tab = b.dataset.tab; render(); }));
}

function render(){
  const nav = NAV.find(n=>n.id===STATE.page);
  const s = SUBJ();
  renderNav(); renderTabs();
  $('#crumb').textContent = `${nav.name} · ${STATE.tab}`;
  $('#pageTitle').textContent = nav.name;
  $('#pageSub').textContent = nav.sub || pageSubtitle(STATE.page, s);
  const fn = (PAGES[STATE.page]||{})[STATE.tab];
  $('#wbPage').innerHTML = fn ? fn() : empty('本页签尚未实现');
  $('#topStatus').textContent = `${s.name} · ${s.site} · ${s.stage? s.stage.overall : '—'} · 演示数据`;
  if(STATE.page==='metrics' && STATE.tab==='一图秀') mountChart();
  if(STATE.page==='metrics' && STATE.tab==='指标卡片') mountCards();
  if(STATE.page==='late' && STATE.tab==='关切清单') mountConcerns();
  if(STATE.page==='mind' && STATE.tab==='我现在的感受') mountViewpoints();
  bindPageActions();
}

function pageSubtitle(page, s){
  const m = {
    board:'四条轨道各自回答一个问题，永远不相加',
    disease:'报告上写了什么、没写什么，分开记',
    tx:'按治疗线分开存，换线不覆盖旧数据',
    airway:'气管造口是终身的，急症要能离线查到',
    voice:'失去声音之后，能恢复到什么程度是可记录的',
    swallow:'呛咳与误吸是两件事，不咳的那种更危险',
    late:'放疗结束不等于结束，十年轨道单独看',
    metrics:'每个指标按自己全期 min/max 归一化，不可互相比较',
    mind:'私密是默认值，不是开关的副作用',
    data:'解析结果只是候选，逐项确认才进事实层'
  };
  return m[page] || '';
}

/* ============================================================
   一图秀：每条线按该指标全期 min/max 归一化
   ============================================================ */
const SERIES_COLOR = ['#0f6b5c','#b4653a','#5b5b8a','#8a6d1f'];

function chartData(codes){
  const s = SUBJ();
  let obs = s.obs.filter(o=>codes.includes(o.code));
  if(STATE.win === '3m'){
    const all = obs.map(o=>o.on).sort();
    if(all.length){
      const last = new Date(all[all.length-1]);
      const cut = new Date(last); cut.setMonth(cut.getMonth()-3);
      obs = obs.filter(o=> new Date(o.on) >= cut);
    }
  }
  return obs;
}

function chartSVG(codes, W, H){
  const s = SUBJ();
  const obs = chartData(codes);
  if(!obs.length) return `<div class="empty">所选时间窗内没有记录</div>`;
  const P = {l:52,r:16,t:16,b:30};
  const iw = W-P.l-P.r, ih = H-P.t-P.b;
  const dates = Array.from(new Set(obs.map(o=>o.on))).sort();
  // 治疗事件与数据同轴：时间范围取「数据 ∪ 事件」并集。
  // 否则「手术早于第一条指标记录」时，最重要的那个事件会被指标窗口裁掉。
  const EV = SUBJ().site === '鼻咽'
    ? [{ d:'2026-04-20', label:'放疗开始' }, { d:'2026-06-30', label:'放疗结束' }]
    : [{ d:'2026-03-18', label:'全喉切除' }, { d:'2026-05-06', label:'放疗开始' },
       { d:'2026-06-10', label:'发音管' }, { d:'2026-06-22', label:'放疗结束' }];
  const bounds = dates.concat(EV.map(e=>e.d)).sort();
  const t0 = new Date(bounds[0]).getTime();
  const t1 = new Date(bounds[bounds.length-1]).getTime();
  const X = d => P.l + (t1===t0 ? iw/2 : (new Date(d).getTime()-t0)/(t1-t0)*iw);

  let out = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="多指标时间轴">`;
  // 事件泳道（分层：事件在上，数据区在下）
  EV.forEach(e=>{
    const x = X(e.d);
    out += `<line x1="${x.toFixed(1)}" y1="6" x2="${x.toFixed(1)}" y2="${H-P.b}" stroke="#c9c5b8" stroke-width="1" stroke-dasharray="3 3"/>`;
    out += `<rect x="${(x-3.5).toFixed(1)}" y="10" width="7" height="7" transform="rotate(45 ${x.toFixed(1)} 13.5)" fill="#8a6d1f"/>`;
    out += `<text x="${(x+6).toFixed(1)}" y="17" font-size="9.5" fill="#8a6d1f">${esc(e.label)}</text>`;
  });
  // 网格线
  for(let i=0;i<=3;i++){
    const y = P.t + ih*i/3;
    out += `<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}" stroke="#eee9dc" stroke-width="1"/>`;
  }
  // 每条线独立归一化
  codes.forEach((code, ci)=>{
    const mo = s.metrics.find(m=>m.code===code);
    const pts = obs.filter(o=>o.code===code).sort((a,b)=> a.on<b.on?-1:1);
    if(!pts.length) return;
    const vals = pts.map(p=>p.v);
    const mn = Math.min(...vals), mx = Math.max(...vals);
    const span = (mx-mn) || 1;
    const Y = v => P.t + ih - ((v-mn)/span)*ih*(span===0?0:1) - (span===0? ih/2 : 0);
    const yOf = v => mn===mx ? P.t+ih/2 : P.t + ih - ((v-mn)/span)*ih;
    const col = SERIES_COLOR[ci % SERIES_COLOR.length];
    if(pts.length > 1){
      const d = pts.map((p,i)=> `${i?'L':'M'}${X(p.on).toFixed(1)},${yOf(p.v).toFixed(1)}`).join(' ');
      out += `<path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    }
    pts.forEach(p=>{
      out += `<circle cx="${X(p.on).toFixed(1)}" cy="${yOf(p.v).toFixed(1)}" r="3.2" fill="#fff" stroke="${col}" stroke-width="2"><title>${esc(mo?mo.label:code)} ${p.v}${esc(mo?mo.unit:'')} · ${p.on}</title></circle>`;
    });
    // 末点标签：靠右边界时改为左挂（anchor=end），否则数字会画到 viewBox 外面
    const last = pts[pts.length-1];
    const lx = X(last.on), ly = yOf(last.v)-5;
    const nearRight = lx > W - P.r - 30;
    out += `<text x="${(nearRight ? lx-6 : lx+6).toFixed(1)}" y="${ly.toFixed(1)}" font-size="10" fill="${col}" font-weight="600"${nearRight?' text-anchor="end"':''}>${last.v}</text>`;
  });
  // 轴
  out += `<line x1="${P.l}" y1="${H-P.b}" x2="${W-P.r}" y2="${H-P.b}" stroke="#c9c5b8"/>`;
  out += `<text x="${P.l}" y="${H-10}" font-size="10" fill="#8a8778">${bounds[0]}</text>`;
  out += `<text x="${W-P.r}" y="${H-10}" font-size="10" fill="#8a8778" text-anchor="end">${bounds[bounds.length-1]}</text>`;
  out += `<text x="8" y="${P.t+4}" font-size="9.5" fill="#8a8778">各线独立</text>`;
  out += `<text x="8" y="${P.t+16}" font-size="9.5" fill="#8a8778">归一化</text>`;
  out += `</svg>`;
  return out;
}

function mountChart(){
  const wrap = $('#chartHost'); if(!wrap) return;
  const codes = STATE.chartCodes || ['weight','alb','hb'];
  wrap.innerHTML = chartSVG(codes, 720, 300);
  const lg = $('#chartLegend');
  if(lg){
    lg.innerHTML = codes.map((c,i)=>{
      const m = SUBJ().metrics.find(x=>x.code===c);
      return m ? `<span><i style="background:${SERIES_COLOR[i%4]}"></i>${esc(m.label)}（${esc(m.unit)}）</span>` : '';
    }).join('');
  }
}

/* ============================================================
   指标卡：固定高度 + preserve-3d，翻转是单卡布尔值
   ============================================================ */
function latestObs(code){
  const o = SUBJ().obs.filter(x=>x.code===code).sort((a,b)=> a.on<b.on?1:-1);
  return o;
}

function metricCard(m, i){
  const o = latestObs(m.code);
  const cur = o[0];
  const prev = o[1];
  let delta = '仅一次记录，无法比较';
  if(cur && prev){
    const d = +(cur.v - prev.v).toFixed(1);
    delta = `${d>0?'+':''}${d} ${m.unit} · 上次 ${prev.v}（${prev.on}）`;
  }
  const back = o.length
    ? `<table>${o.slice(0,4).map(x=>`<tr><td>${x.on}</td><td style="text-align:right">${x.v}</td></tr>`).join('')}</table>
       <div class="src" style="margin-top:8px">按本指标全期 min/max 归一化<br>不可与其它指标比较</div>`
    : `<div class="src">还没有记录</div>`;
  const grad = m.grade && m.grade !== '无' ? tag(`对照 ${m.grade}`, 'teal') : tag('无分级标准');
  return `<div class="metric-card" data-flipped="false" data-metric="${m.code}" role="group" tabindex="0" aria-pressed="false" aria-label="${esc(m.label)} 指标卡，可翻转查看趋势">
    <div class="mc-inner">
      <div class="mc-face front">
        <div class="mc-head"><span class="mc-name">${esc(m.label)}</span>${grad}</div>
        <div class="mc-val">${cur?cur.v:'—'}<span class="u">${esc(m.unit)}</span></div>
        <div class="mc-delta">${esc(delta)}</div>
        <div class="mc-meta">${cur?`${cur.on} · ${esc(cur.lab)}`:'—'}<br>共 ${o.length} 次记录</div>
        <div class="mc-flip-hint">点卡片看趋势 ›</div>
      </div>
      <div class="mc-face back" aria-hidden="true" inert>
        <div class="mc-back-h">${esc(m.label)} 最近记录</div>
        <div class="mc-back-body">${back}</div>
      </div>
    </div>
  </div>`;
}

function mountCards(){
  const host = $('#cardHost'); if(!host) return;
  const ms = SUBJ().metrics;
  host.innerHTML = ms.length ? ms.map(metricCard).join('') : empty('还没有定义指标');
  $$('.metric-card').forEach(c=>{
    const flip = ()=>{
      const on = c.dataset.flipped !== 'true';
      c.dataset.flipped = String(on);
      c.setAttribute('aria-pressed', String(on));
      const back = c.querySelector('.mc-face.back');
      const front = c.querySelector('.mc-face.front');
      back.setAttribute('aria-hidden', String(!on));
      front.setAttribute('aria-hidden', String(on));
      if(on) back.removeAttribute('inert'); else back.setAttribute('inert','');
    };
    c.addEventListener('click', flip);
    c.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flip(); }
    });
  });
}

      <div class="chart-wrap" id="chartHost"></div>
      <div class="legend" id="chartLegend"></div>`, '每条线独立归一化，因此<b>不同指标的高低不可比较</b>；单点只画点不连线')}
    ${notice('治疗事件（手术 / 放疗 / 发音管）画在上方的菱形与虚线上，和数据区是分层的 —— 它们不是数值，不能被读成曲线的一部分。')}`,
  '分级说明': () => {
    const s = SUBJ();
    return `
    ${card('口腔黏膜炎 · WHO 分级', tbl(['级别','进食形态','说明'],[
      ['0 级','正常','无黏膜改变'],
      ['1 级','普通','红斑、轻微疼痛'],
      ['2 级','半流质','溃疡，能进半流质'],
      ['3 级','流质','只能进流质'],
      ['4 级','不能进食','无法经口进食']
    ]), '本工作台采用 WHO 口径，因为它按「今天能吃什么形态」分级，患者自己就能判断')}
    ${notice(`分级是<b>对照</b>，不是诊断。徽章写「对照 WHO 分级」，并显示区间与来源。<b>不采用 CTCAE 作为该指标口径</b> —— CTCAE 需要口腔检查所见，患者填不了。`,'warn')}
    ${card('当前记录', s.mucositis.length ? tbl(['日期','级别','进食形态','备注'],[
      s.mucositis.map(m=>[esc(m.on), m.grade+' 级', esc(m.form), esc(m.note||'—')])
    ]) : empty('还没有黏膜炎记录'))}
    ${src('WHO 口腔黏膜炎分级（1979）；EV-02 指出尚无证据显示某一种分级标准更优，故按可自评性选择口径')}`;
  }
};

/* ---------- 9 心理与家人 ---------- */
PAGES.mind = {
  '我现在的感受': () => `<div id="vpHost"></div>`,
  '家里人要做什么': () => {
    const s = SUBJ();
    return `
    ${card('照护者记录', s.caregiver.length ? `<ul class="qlist">${s.caregiver.map(g=>`<li>${esc(g.text)}<br><span class="src">${esc(g.on)} · 记录人：${esc(g.by)}</span></li>`).join('')}</ul>` : empty('还没有照护者记录'), '「记录人」与「记录的是谁」是两个独立字段')}
    ${notice(`照护者可以代记，但<b>代记不等于替患者做决定</b>。凡是涉及「他怎么想」的内容，本工作台默认设为私密，不会进入给医生的摘要。`,'warn')}
    ${card('可以帮的三件事', `<ul class="qlist">
      <li>帮他记住「要问医生的问题」，复诊时念原文</li>
      <li>在他说话时<b>不替他说完</b>，等他把话说完</li>
      <li>造口急症时知道该说什么（见「气道与造口 › 堵管与脱管」的急救卡）</li>
    </ul>`)}`;
  },
  '说不出口的事': () => {
    const s = SUBJ();
    const priv = s.viewpoints.filter(v=>v.vis==='private');
    return `
    ${notice(`这一页的内容<b>默认私密</b>：不进复诊摘要、不进导出、不进给家人的视图。要看它，只能在本机、由本人打开。`,'crit')}
    ${card('只写给自己看的', priv.length ? `<ul class="qlist">${priv.map(v=>`<li>${tag(v.kind)} ${esc(v.text)}<br><span class="src">${esc(v.on)}</span></li>`).join('')}</ul>` : empty('还没有记录'))}
    ${card('为什么要把这些单独放一页', `<p>「晚上睡不着，老想最坏的情况，但不想让他们担心」「说三遍人家还听不清，我就不说了」—— 这些话如果混在病历里，会跟着摘要一起给医生和家属看，于是患者就不写了。</p>
      <p class="hint">私密不是「锁起来」的噱头，是让这类记录<b>有可能存在</b>的前提。</p>`)}`;
  }
};

/* ---------- 10 资料与导出 ---------- */
PAGES.data = {
  '我的资料与草稿': () => {
    const s = SUBJ();
    return `
    ${card('资料', s.docs.length ? tbl(['文件','类型','解析状态','路径'],[
      s.docs.map(d=>[esc(d.title), esc(d.kind), d.state==='已解析'? tag(d.state,'teal'):tag(d.state,'warn'), `<span class="src">${esc(d.path)}</span>`])
    ]) : empty('还没有资料'))}
    ${card('待核对的草稿', s.drafts.length ? tbl(['字段','抄下来的值','单位','状态','备注'],[
      s.drafts.map(d=>[esc(d.field), esc(d.value), esc(d.unit||'—'), tag(d.state,'warn'), esc(d.note||'—')])
    ]) : empty('没有待核对的草稿'), '草稿不是事实。逐项确认后才进指标与档案')}
    ${notice('解析由用户显式触发，且会告知「原件要出本机」。本演示档案不含真实文件，路径为示意。','warn')}`;
  },
  '导出给医生': () => {
    const s = SUBJ();
    const privCount = s.viewpoints.filter(v=>v.vis==='private').length + s.concerns.filter(c=>c.vis==='private').length;
    return `
    ${card('导出选项', `<div class="grid2">
      <div><label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" id="optPrivate"> 包含私密记录（${privCount} 条）</label>
      <p class="hint" style="margin:8px 0 0">默认不包含。勾选后会明确提示「这些内容将出现在给医生看的文件里」。</p></div>
      <div><p class="hint" style="margin:0">导出格式：可打印摘要（A4）/ 纯文本。本演示环境不生成真实文件。</p></div>
    </div>`)}
    ${notice('导出必须得到<b>格式真实的文件</b>，而不是弹一句「已导出」。演示阶段明确标注未接通，不做假成功。','warn')}
    ${card('摘要包含什么', `<ul class="qlist">
      <li>基本信息与诊断（原发部位、分期、病理要点）</li>
      <li>治疗线一览（含起止与目的）</li>
      <li>最近 3–6 次关键指标与趋势</li>
      <li>造口与发声现状、进食途径</li>
      <li>未解决的关切与这次想问的问题</li>
    </ul>`, '缺的项写「本次未带」，不写「无」——「没查」与「正常」是两件事')}`;
  }
};

/* ============================================================
   动态挂载：关切清单 / 感受
   ============================================================ */
function mountConcerns(){
  const host = $('#concernHost'); if(!host) return;
  const s = SUBJ();
  const rows = s.concerns.map(c=>`
    <div class="concern" data-id="${c.id}">
      <div>
        <div class="txt">${esc(c.text)} ${c.vis==='private'? tag('私密','crit'):''}</div>
        <div class="meta">${esc(c.kind)}${c.asked? ' · 已问过' : ' · 还没问'}${c.answer? ' · 医生回答：'+esc(c.answer) : ''}</div>
      </div>
      <div class="ops">
        <button class="mini" data-act="asked" aria-pressed="${!!c.asked}">问过了</button>
        <button class="mini" data-act="done" aria-pressed="${!!c.addressed}">解决了</button>
        <button class="mini" data-act="vis" aria-pressed="${c.vis==='private'}">私密</button>
      </div>
    </div>`).join('');
  host.innerHTML = `<div class="card"><h3>关切清单</h3>
    <p class="hint">把「想问的」和「担心的」都丢进来。解决了的不要删 —— 复诊时能看到「这个问题问过了、当时医生怎么答」。</p>
    ${rows || empty('还没有记录')}
    <div class="addrow">
      <input id="cInput" placeholder="想问的 / 担心的…">
      <select id="cKind"><option>要问的问题</option><option>担心</option></select>
      <button id="cAdd">加一条</button>
    </div></div>`;
  host.querySelectorAll('.concern').forEach(row=>{
    row.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
      const c = s.concerns.find(x=>x.id===row.dataset.id);
      if(b.dataset.act==='asked') c.asked = c.asked?0:1;
      if(b.dataset.act==='done') c.addressed = c.addressed?0:1;
      if(b.dataset.act==='vis') c.vis = c.vis==='private'? 'shared':'private';
      mountConcerns();
    }));
  });
  $('#cAdd').addEventListener('click',()=>{
    const v = $('#cInput').value.trim(); if(!v) return;
    s.concerns.unshift({ id:'c'+Date.now(), text:v, kind:$('#cKind').value, asked:0, answer:null, addressed:0, vis:'private' });
    mountConcerns(); toast('已加入关切清单（默认私密）');
  });
}

function mountViewpoints(){
  const host = $('#vpHost'); if(!host) return;
  const s = SUBJ();
  const rows = s.viewpoints.map(v=>`<li>${tag(v.kind)} ${esc(v.text)}<br><span class="src">${esc(v.on)} · ${v.vis==='private'?'仅本人可见':'可与医生共享'}</span></li>`).join('');
  host.innerHTML = `
    ${notice(`本页默认私密，<b>不会进入复诊摘要与导出</b>。`,'crit')}
    <div class="card"><h3>记一条</h3>
      <p class="hint">不用组织语言，也不用判断该不该有这种感觉。</p>
      <ul class="qlist">${rows || '<li class="src">还没有记录</li>'}</ul>
      <div class="addrow">
        <input id="vInput" placeholder="今天的感觉…">
        <select id="vKind"><option>感受</option><option>病耻</option><option>外形</option><option>害怕复发</option><option>疲惫</option></select>
        <button id="vAdd">记下</button>
      </div>
    </div>`;
  $('#vAdd').addEventListener('click',()=>{
    const v = $('#vInput').value.trim(); if(!v) return;
    s.viewpoints.unshift({ id:'v'+Date.now(), kind:$('#vKind').value, text:v, on:new Date().toISOString().slice(0,10), vis:'private' });
    mountViewpoints(); toast('已记录（私密）');
  });
}

/* ============================================================
   全局交互
   ============================================================ */
function bindPageActions(){
  const pb = $('#btnPrintCard');
  if(pb) pb.addEventListener('click',()=>{ window.print(); });
  const ps = $('#btnPrintSummary');
  if(ps) ps.addEventListener('click',()=>{ window.print(); });
  $$('#winBtns button').forEach(b=>b.addEventListener('click',()=>{
    STATE.win = b.dataset.win; render();
  }));
}

function init(){
  $('#prof').addEventListener('change', e=>{
    STATE.profile = e.target.value;
    STATE.page = 'board'; STATE.tab = '今天要知道的';
    render();
    toast('已切换到 ' + SUBJ().name);
  });
  $('#btnPrint').addEventListener('click', ()=>window.print());
  $('#btnAgent').addEventListener('click', ()=>{
    const on = $('#shell').classList.toggle('with-agent');
    $('#btnAgent').setAttribute('aria-pressed', String(on));
  });
  $('#btnAgentClose').addEventListener('click', ()=>{
    $('#shell').classList.remove('with-agent');
    $('#btnAgent').setAttribute('aria-pressed','false');
  });
  $('#btnCopyPrompt').addEventListener('click', ()=>{
    const s = SUBJ();
    const txt = `我在用「小言宝 VoicePal」记录${s.site}癌的治疗与康复。当前页：${NAV.find(n=>n.id===STATE.page).name} › ${STATE.tab}。\n我的情况：${s.site} ${s.siteDetail}，${s.stage.overall}，${s.surgery? s.surgery.procedure : '未手术'}，${s.airway.kind}。\n请基于以上信息帮我整理这次想问医生的问题。不要替我判断治疗方案。`;
    navigator.clipboard?.writeText(txt); toast('已复制场景提示词');
  });
  $('#btnCopySummary').addEventListener('click', ()=>{
    const s = SUBJ();
    const txt = `${s.name}｜${s.site} ${s.siteDetail}｜${s.stage.overall}\n治疗线：${s.lines.map(l=>l.no+'. '+l.name).join('；')}\n气道：${s.airway.kind}\n最近体重：${(latestObs('weight')[0]||{}).v||'—'} kg\n未解决关切：${s.concerns.filter(c=>!c.addressed).map(c=>c.text).join('；')||'无'}`;
    navigator.clipboard?.writeText(txt); toast('已复制本页要点');
  });
  $('#agentSend').addEventListener('click', ()=>{
    const v = $('#agentInput').value.trim(); if(!v) return;
    const box = $('#agentMsgs');
    box.insertAdjacentHTML('beforeend', `<div class="m me">${esc(v)}</div>`);
    box.insertAdjacentHTML('beforeend', `<div class="m ai">（演示环境）这里会由 AI 助手回答。真实版本接入 DSH 原生会话，不会在页面内自造一套聊天。</div>`);
    $('#agentInput').value = ''; box.scrollTop = box.scrollHeight;
  });
  $('#agentInput').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#agentSend').click(); });
  render();
}

document.addEventListener('DOMContentLoaded', init);
</script>

</body>
